name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Unit tests
        run: composer test

      - name: PHPStan
        run: composer phpstan -- --no-progress

      - name: PHPCS
        run: composer phpcs

  integration:
    name: Integration (PHP ${{ matrix.php }}, WP ${{ matrix.wp }}, WC ${{ matrix.woocommerce }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The latest releases, and the oldest the plugin claims to support
        # (Requires at least / WC requires at least in persian-kit.php) on
        # the oldest PHP. Yoast 28.3 and later need WordPress 6.9.
        include:
          - { php: '8.4', wp: '7.1.2', woocommerce: '11.1.2', yoast: '28.6' }
          - { php: '8.1', wp: '6.8.10', woocommerce: '9.9.7', yoast: '28.2' }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      WP_CORE_DIR: /tmp/wordpress
      WP_VERSION: ${{ matrix.wp }}
      # The checkout, form, SEO and multilingual integration tests run against these releases.
      WOOCOMMERCE_VERSION: ${{ matrix.woocommerce }}
      PERSIAN_KIT_TESTS_WOOCOMMERCE_DIR: /tmp/wordpress/wp-content/plugins/woocommerce
      CF7_VERSION: '6.1.7'
      PERSIAN_KIT_TESTS_CF7_DIR: /tmp/wordpress/wp-content/plugins/contact-form-7
      ACF_VERSION: '6.8.10'
      PERSIAN_KIT_TESTS_ACF_DIR: /tmp/wordpress/wp-content/plugins/advanced-custom-fields
      FORMINATOR_VERSION: '1.57.3'
      PERSIAN_KIT_TESTS_FORMINATOR_DIR: /tmp/wordpress/wp-content/plugins/forminator
      WORDPRESS_SEO_VERSION: ${{ matrix.yoast }}
      PERSIAN_KIT_TESTS_YOAST_DIR: /tmp/wordpress/wp-content/plugins/wordpress-seo
      RANK_MATH_VERSION: '1.0.279'
      PERSIAN_KIT_TESTS_RANK_MATH_DIR: /tmp/wordpress/wp-content/plugins/seo-by-rank-math
      # Loaded only for the multilingual run.
      POLYLANG_VERSION: '3.8.10'
      PERSIAN_KIT_TESTS_POLYLANG_DIR: /tmp/wordpress/wp-content/plugins/polylang
      # Loaded only for the run against the plugins a site can switch from.
      # WordPress.org keeps no zip of Persian WooCommerce 10.0.5 or its
      # shipping plugin 4.4.8, so their latest releases are tested.
      PARSIDATE_VERSION: '6.4'
      PERSIAN_KIT_TESTS_PARSIDATE_DIR: /tmp/wordpress/wp-content/plugins/wp-parsidate
      PERSIAN_KIT_TESTS_PERSIAN_WOOCOMMERCE_DIR: /tmp/wordpress/wp-content/plugins/persian-woocommerce
      PERSIAN_KIT_TESTS_PWS_DIR: /tmp/wordpress/wp-content/plugins/persian-woocommerce-shipping
      WP_TEST_DB_HOST: 127.0.0.1
      WP_TEST_DB_USER: root
      WP_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, mysqli
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Download WordPress
        run: |
          mkdir -p "$WP_CORE_DIR"
          curl -sSL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" | tar -xz --strip-components=1 -C "$WP_CORE_DIR"

      - name: Download WooCommerce
        run: |
          curl -sSfL -o /tmp/woocommerce.zip "https://downloads.wordpress.org/plugin/woocommerce.${WOOCOMMERCE_VERSION}.zip"
          unzip -q /tmp/woocommerce.zip -d "$WP_CORE_DIR/wp-content/plugins"
          test -f "$PERSIAN_KIT_TESTS_WOOCOMMERCE_DIR/woocommerce.php"

      # What the Jalali Analytics script replaces is still in this WooCommerce
      # (Node's built-in modules only; this job has no npm packages).
      - name: Analytics date contract
        run: node --test tests/js/woocommerce-analytics-contract.test.mjs

      - name: Download Contact Form 7
        run: |
          curl -sSfL -o /tmp/contact-form-7.zip "https://downloads.wordpress.org/plugin/contact-form-7.${CF7_VERSION}.zip"
          unzip -q /tmp/contact-form-7.zip -d "$WP_CORE_DIR/wp-content/plugins"
          test -f "$PERSIAN_KIT_TESTS_CF7_DIR/wp-contact-form-7.php"

      - name: Download ACF
        run: |
          curl -sSfL -o /tmp/acf.zip "https://downloads.wordpress.org/plugin/advanced-custom-fields.${ACF_VERSION}.zip"
          unzip -q /tmp/acf.zip -d "$WP_CORE_DIR/wp-content/plugins"
          test -f "$PERSIAN_KIT_TESTS_ACF_DIR/acf.php"

      - name: Download Forminator
        run: |
          curl -sSfL -o /tmp/forminator.zip "https://downloads.wordpress.org/plugin/forminator.${FORMINATOR_VERSION}.zip"
          unzip -q /tmp/forminator.zip -d "$WP_CORE_DIR/wp-content/plugins"
          test -f "$PERSIAN_KIT_TESTS_FORMINATOR_DIR/forminator.php"

      - name: Download Yoast SEO
        run: |
          curl -sSfL -o /tmp/wordpress-seo.zip "https://downloads.wordpress.org/plugin/wordpress-seo.${WORDPRESS_SEO_VERSION}.zip"
          unzip -q /tmp/wordpress-seo.zip -d "$WP_CORE_DIR/wp-content/plugins"
          test -f "$PERSIAN_KIT_TESTS_YOAST_DIR/wp-seo.php"

      - name: Download Rank Math
        run: |
          curl -sSfL -o /tmp/seo-by-rank-math.zip "https://downloads.wordpress.org/plugin/seo-by-rank-math.${RANK_MATH_VERSION}.zip"
          unzip -q /tmp/seo-by-rank-math.zip -d "$WP_CORE_DIR/wp-content/plugins"
          test -f "$PERSIAN_KIT_TESTS_RANK_MATH_DIR/rank-math.php"

      - name: Download Polylang
        run: |
          curl -sSfL -o /tmp/polylang.zip "https://downloads.wordpress.org/plugin/polylang.${POLYLANG_VERSION}.zip"
          unzip -q /tmp/polylang.zip -d "$WP_CORE_DIR/wp-content/plugins"
          test -f "$PERSIAN_KIT_TESTS_POLYLANG_DIR/polylang.php"

      - name: Download Parsi Date, Persian WooCommerce and its shipping plugin
        run: |
          for plugin in "wp-parsidate.${PARSIDATE_VERSION}" persian-woocommerce persian-woocommerce-shipping; do
            curl -sSfL -o "/tmp/${plugin}.zip" "https://downloads.wordpress.org/plugin/${plugin}.zip"
            unzip -q "/tmp/${plugin}.zip" -d "$WP_CORE_DIR/wp-content/plugins"
          done
          test -f "$PERSIAN_KIT_TESTS_PARSIDATE_DIR/wp-parsidate.php"
          test -f "$PERSIAN_KIT_TESTS_PERSIAN_WOOCOMMERCE_DIR/woocommerce-persian.php"
          test -f "$PERSIAN_KIT_TESTS_PWS_DIR/woocommerce-shipping.php"
          grep -h '^ \* Version:' "$PERSIAN_KIT_TESTS_PERSIAN_WOOCOMMERCE_DIR/woocommerce-persian.php" "$PERSIAN_KIT_TESTS_PWS_DIR/woocommerce-shipping.php"

      - name: Set up WordPress test library
        run: composer test:integration:setup

      - name: Integration tests
        run: composer test:integration

      - name: Integration tests (Polylang)
        run: composer test:integration:polylang

      - name: Integration tests (Parsi Date, Persian WooCommerce, shipping)
        run: composer test:integration:sources

  js:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # jsdom and jQuery for the script tests.
      - name: Install npm dependencies
        run: npm ci

      # The date field tests load the built date picker.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:js

  build:
    name: Build and Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      # dist.sh needs `wp` for the POT file. setup-php's wp-cli tool fails
      # ("Could not setup wp-cli") without failing the step, so install the
      # release phar, checked against its published SHA-512.
      - name: Install WP-CLI
        run: |
          curl -fsSL -o /tmp/wp-cli.phar https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832  /tmp/wp-cli.phar" | sha512sum --check
          sudo install -m 755 /tmp/wp-cli.phar /usr/local/bin/wp
          wp --version

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build distributable
        run: npm run dist

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: persian-kit
          path: dist/persian-kit.zip

      - name: Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/persian-kit
