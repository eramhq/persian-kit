name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Unit tests
        run: composer test

      - name: PHPStan
        run: composer phpstan -- --no-progress

      - name: PHPCS
        run: composer phpcs

  integration:
    name: Integration (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
        wp: ['7.1.2']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      WP_CORE_DIR: /tmp/wordpress
      WP_VERSION: ${{ matrix.wp }}
      WP_TEST_DB_HOST: 127.0.0.1
      WP_TEST_DB_USER: root
      WP_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, mysqli
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Download WordPress
        run: |
          mkdir -p "$WP_CORE_DIR"
          curl -sSL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" | tar -xz --strip-components=1 -C "$WP_CORE_DIR"

      - name: Set up WordPress test library
        run: composer test:integration:setup

      - name: Integration tests
        run: composer test:integration

  build:
    name: Build and Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: wp-cli
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build distributable
        run: npm run dist

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: persian-kit
          path: dist/persian-kit.zip

      - name: Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/persian-kit
