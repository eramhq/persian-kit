name: Readme and assets

# Pushes readme.txt and the .wordpress-org images (banners, icon, screenshots) to WordPress.org when they change on
# main, without a new plugin version: the plugin code on WordPress.org is untouched (IGNORE_OTHER_FILES). The readme
# also replaces the one in tags/<Stable tag>/, which is the copy the plugin page shows.
# Runs only when readme.txt's Stable tag is a version that is already tagged, and the newest changelog entry is that
# version. While a new version is being prepared on main, its readme waits for the release (deploy.yml ships it with
# the code).
# Uses the same `wordpress-org` environment as deploy.yml (variable SVN_USERNAME, secret SVN_PASSWORD).
on:
  push:
    branches: [main]
    paths:
      - readme.txt
      - .wordpress-org/**
  workflow_dispatch:

concurrency:
  group: deploy-wordpress-org
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assets:
    name: Update readme and assets on WordPress.org
    runs-on: ubuntu-latest
    environment:
      name: wordpress-org
      url: https://wordpress.org/plugins/persian-kit/
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: The readme's Stable tag is already released
        id: released
        run: |
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt | tr -d '\r')
          newest=$(sed -n '/^== Changelog ==/,$ s/^= *\([0-9][0-9.]*\) *=.*/\1/p' readme.txt | head -1)
          if [ "$newest" != "$stable" ]; then
            # Notes for the next version wait for its release; WordPress.org must not show a version it cannot install.
            echo "::notice::The changelog starts at $newest but Stable tag is $stable; the readme goes out with the $newest release."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$stable" > /dev/null; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Stable tag $stable is not tagged yet; the readme goes out with that release."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: 10up/action-wordpress-plugin-asset-update@2.2.0
        if: steps.released.outputs.ok == 'yes'
        env:
          SVN_USERNAME: ${{ vars.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: persian-kit
          ASSETS_DIR: .wordpress-org
          IGNORE_OTHER_FILES: true
